# goreleaser config. The asset names it produces must match the [artifact] lines in the
# repo-root toy.toml character for character — a mismatch shows up as "no build for this
# platform" while both files look fine on their own. Touch name_template, then run
# `make verify-toyfile`.
version: 2

project_name: toy

builds:
  - id: toy
    main: ./cmd/toy
    binary: toy
    # CGO_ENABLED=0 is the one line here that must not change: a fully static binary runs
    # on both glibc and musl, so shipping only the two-segment key (linux/amd64) is enough
    # and no separate /musl build is needed. See the design notes §3.1.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Spec §11: no Windows in v1. It is absent from goos above, so nothing to exclude here.

archives:
  - id: toy
    formats:
      - tar.gz
    # The binary sits at the archive root (no wrapper directory), which is why toy.toml
    # says [bin] toy = "toy".
    wrap_in_directory: false
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# An -rc / -beta tag is marked pre-release on GitHub instead of becoming "Latest".
# toy itself already skips pre-releases when picking a version (semver.Max with
# allowPre=false), so without this the release page and the installer would
# disagree about which release is current.
release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: |
    ---
    Install toy with toy: `toy install github:Cirraya-LLC/toy`
