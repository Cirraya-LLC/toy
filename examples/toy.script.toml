# Single-file script form: nothing to compile, nothing to package, nothing beyond one
# release asset. toy downloads it, chmod +x, symlinks it into ~/.toy/bin. That's all.
#
# [artifact] and [script] are mutually exclusive -- pick one, never both.

name    = "gitwip"
desc    = "stash the working tree into a WIP commit and pop straight back"
license = "MIT"

[script]
gitwip = "gitwip.sh"
