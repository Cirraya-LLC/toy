# toy's own toy.toml -- this is the file that installs toy:
#
#   toy install github:Cirraya-LLC/toy
#
# The asset names come from archives.name_template in .goreleaser.yaml, and the
# two must match character for character.
# Check it with: make verify-toyfile (builds a fake dist, runs toy init against
# it, and diffs -- the diff must be empty).
name     = "toy"
desc     = "install the small tools nobody packaged for you -- nothing is executed at install time"
license  = "MIT"
homepage = "https://github.com/Cirraya-LLC/toy"

# Left = the command name on PATH, right = the relative path inside the
# extracted package. goreleaser's wrap_in_directory is false, so the binary
# sits at the root of the archive.
[bin]
toy = "toy"

# Two-segment keys only: a CGO_ENABLED=0 build is fully static, so glibc and
# musl get the same bytes. There is no second build to ship and therefore no
# need for the /musl segment.
[artifact]
"linux/amd64"  = "toy_{version}_linux_amd64.tar.gz"
"linux/arm64"  = "toy_{version}_linux_arm64.tar.gz"
"darwin/amd64" = "toy_{version}_darwin_amd64.tar.gz"
"darwin/arm64" = "toy_{version}_darwin_arm64.tar.gz"

# Deliberately no [sha256]: this file is read from the tag, while the release
# assets are built after the tag is cut -- when this file is committed the
# hashes do not exist yet. So the install side uses TOFU (pinned on first
# install, and a later change is refused). Per-release hashes live in
# checksums.txt inside the release.
