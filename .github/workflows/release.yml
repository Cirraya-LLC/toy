name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs full history to build the changelog and to resolve .Version.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The build only happens after the tag is pushed, so if toy.toml's asset names don't
      # match, everyone who installs gets hurt — and the tag can no longer be changed
      # (iron law 6). Check it one more time here.
      - run: make verify-toyfile

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
