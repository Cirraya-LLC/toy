# Index regression check.
#
# Carrying someone else's software means we have vouched for their packaging: upstream
# changes its asset naming habit once and our entry rots, and the user blames toy. So the
# index needs regression tests exactly like the code does — and they must run **on a
# schedule**, because the moment an entry rots we have not touched a single line here.
name: index-check

on:
  schedule:
    - cron: "17 3 * * *"   # daily (UTC). Off the hour, so we don't pile in with everyone else's cron
  workflow_dispatch:
  pull_request:
    paths:
      - "index/**"
      - "scripts/index-check.sh"
      - ".github/workflows/index-check.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false   # one platform failing must not hide the other platform's result
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # PRs need to diff against base

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # A PR touching two entries should not run everything: installing dozens of packages
      # takes minutes each time.
      #
      # -U40 gives deliberately generous context: an entry is at most a couple of dozen
      # lines (an inlined toyfile is one long JSON string), so when only the "toyfile" line
      # changed, that entry's "id" line is guaranteed to be pulled in with it. The cost is
      # sweeping in two or three neighbouring entries — testing a few extra is harmless,
      # **missing one is not**. That asymmetry is the whole reason for this direction.
      - name: work out which entries this PR touched
        if: github.event_name == 'pull_request'
        id: only
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          # grep finding no id is the "no entries touched" answer, not an error: without
          # the `|| true`, pipefail turned a README-only change under index/ into a
          # failed check.
          ids="$(git diff -U40 "$base" -- index/ \
                 | { grep -oE '"id"[[:space:]]*:[[:space:]]*"[^"]+"' || true; } \
                 | sed 's/.*"\([^"]*\)"$/\1/' | sort -u | paste -sd, -)"
          if [ -z "$ids" ]; then
            echo "this PR touches no entries; skipping."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "will test: $ids"
            echo "ids=$ids" >> "$GITHUB_OUTPUT"
          fi

      - name: index-check (only the entries that changed)
        if: github.event_name == 'pull_request' && steps.only.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # see the note on the step below
        run: bash scripts/index-check.sh --only "${{ steps.only.outputs.ids }}"

      - name: index-check (everything)
        if: github.event_name != 'pull_request'
        # Only read when toy had to fall back past a tag whose files were missing: the
        # script then asks GitHub how long ago that release was published, to tell
        # "still uploading" from "upstream renamed its assets". The token is only there
        # for the rate limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          bash scripts/index-check.sh --results "out/results-${{ matrix.os }}.tsv"

      # For the dead job below. Kept even when entries fail, which is when it matters.
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: results-${{ matrix.os }}
          path: out/results-${{ matrix.os }}.tsv
          if-no-files-found: ignore
          retention-days: 7

      # index-check above installs and runs, which it can only do for the platform
      # of this runner. This one HEADs every platform an entry declares, and it is
      # the only thing here that sees darwin from a linux runner and the other way
      # round. Runs once per matrix leg -- the same URLs, but a failure that shows
      # up on only one of them is itself worth knowing about.
      - name: index-urls (every declared platform, not just this runner's)
        if: github.event_name == 'pull_request' && steps.only.outputs.skip != '1'
        run: bash scripts/index-urls.sh --only "${{ steps.only.outputs.ids }}"

      - name: index-urls (everything)
        if: github.event_name != 'pull_request'
        run: bash scripts/index-urls.sh

  # A failure of the scheduled run has to leave a trace: nobody reads the logs of a
  # workflow that runs every day. If an issue with the same title is already open, comment
  # on it instead of opening another — five broken days must not become five issues.
  report:
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open an issue, or comment on the existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # with this, no checkout is needed just to orient gh
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="index-check failed ($(date -u +%F))"
          body=$(printf 'The scheduled index-check has failing entries.\n\nFull log (with the failure details, ready to copy): %s\n\nThe three categories are handled differently:\n- **entry** — fix that record in `index/toy-index.json` (upstream most likely changed its asset naming habit)\n- **network** — retry, leave the index alone\n- **runtime** — upstream'"'"'s release is broken, or the in-package path in `[bin]` was guessed wrong\n' "$RUN_URL")
          # Match on the title's fixed prefix, not the whole title: the date in it
          # changes daily, and matching it exactly opened a new issue every day the same
          # entry stayed broken (five of them for one fastfetch rename in October 2026).
          # Not --search: it tokenizes, and punctuation can fail to match.
          existing="$(gh issue list --state open --limit 100 --json number,title \
                      --jq '[.[] | select(.title | startswith("index-check failed"))] | sort_by(.number) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # A green scheduled run closes what the red ones opened, so an open issue always means
  # something is broken today.
  resolved:
    needs: check
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: close the open index-check issue, if any
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --limit 100 --json number,title \
                       --jq '.[] | select(.title | startswith("index-check failed")) | .number'); do
            gh issue close "$n" --comment "Today's scheduled run passed: $RUN_URL"
          done

  # An entry whose upstream has nothing left to install -- the repository deleted or made
  # private, every release gone -- fails above every day, and no edit to the entry can
  # help. When today's results and GitHub agree on that for three daily runs in a row
  # (cmd/toy-index/dead.go), the entry is dropped by a pull request this job merges, the
  # same way a discovery batch is. Every other failure stays on the issue for a person.
  dead:
    needs: check
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # most of it is waiting for the PR's own required checks
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write   # the count's cache, the PR's held checks, the site deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: out
          merge-multiple: true

      # The count of days in a row lives in the Actions cache, one entry per run; the
      # newest is restored. An evicted cache starts the count again, which only delays.
      - uses: actions/cache/restore@v6
        with:
          path: state
          key: index-dead-${{ github.run_id }}
          restore-keys: index-dead-

      - name: count the dead, and drop the ones dead for three days
        id: count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A day one leg left no results is no evidence either way: the count stays as
          # it was, neither advanced nor reset.
          for os in ubuntu-latest macos-latest; do
            [ -s "out/results-$os.tsv" ] || { echo "the $os leg left no results; not counting today"; exit 0; }
          done
          go run ./cmd/toy-index dead --state state/dead.tsv --days 3 --apply --report out/drop.md \
            --results out/results-ubuntu-latest.tsv,out/results-macos-latest.tsv
          echo "counted=1" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v6
        if: steps.count.outputs.counted == '1'
        with:
          path: state
          key: index-dead-${{ github.run_id }}

      - name: open the pull request, and merge it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index/toy-index.json; then
            echo "nothing has been dead for three days"
            exit 0
          fi
          open=$(gh pr list --state open --json number,headRefName \
                   --jq '[.[] | select(.headRefName | startswith("index/drop-"))][0].number // empty')
          if [ -n "$open" ]; then
            echo "#$open is still open; not opening a second one"
            exit 0
          fi
          ids=$(git diff -U0 -- index/toy-index.json \
                  | { grep -oE '^-[[:space:]]*"id"[[:space:]]*:[[:space:]]*"[^"]+"' || true; } \
                  | sed 's/.*"\([^"]*\)"$/\1/' | paste -sd' ' -)
          n=$(wc -w <<<"$ids" | tr -d ' ')
          printf '\nFound by the daily index-check: %s\n' "$RUN_URL" >> out/drop.md
          branch="index/drop-$(date -u +%F)-${{ github.run_number }}"
          git config user.name Cirraya
          git config user.email tech@cirraya.com
          git switch -c "$branch"
          git add index/toy-index.json
          git commit -q -m "index: drop $n entries whose upstream has nothing left to install" -m "$ids"
          git push -q origin "$branch"
          # The number comes from create's own output, never from a listing.
          url=$(gh pr create --base main --head "$branch" \
            --title "index: drop $n entries whose upstream has nothing left to install" --body-file out/drop.md)
          num="${url##*/}"
          echo "opened #$num: $ids"
          bash scripts/automerge.sh "$num" "$branch"
          # Say so where people are already looking.
          issue=$(gh issue list --state open --limit 100 --json number,title \
                    --jq '[.[] | select(.title | startswith("index-check failed"))] | sort_by(.number) | .[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Dropped in #$num, upstream has nothing left to install: $ids"
          fi
