name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race -count=1

      - name: e2e
        run: bash scripts/e2e.sh

      - name: e2e (the six rules for index-inlined toyfiles)
        run: bash scripts/e2e-inline.sh

  # A mismatched asset name is the easiest mistake to make and the hardest to notice in
  # this release chain: both files look fine on their own, and the symptom only shows up
  # when somebody else runs install. So check it on every PR.
  toyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make verify-toyfile

  # Build without releasing, to confirm .goreleaser.yaml itself is sound — otherwise we
  # find out the moment a tag is pushed, and tags are immutable (iron law 6).
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
