# Weekly index discovery: find command-line tools on GitHub that are not listed yet,
# generate their entries, install every one on Linux and macOS, and open a pull request
# with the ones that worked.
#
#   discover  GitHub search by topic, most stars first. Keeps only repos with a licence
#             that allows redistribution, not in index/delisted.txt or declined.txt, and
#             that gen would accept (cmd/toy-index/discover.go)
#   gen       entries for them, with --probe: a real archive is unpacked for each
#   check     index-check on both runners; --results says which installed and ran
#   merge     passed somewhere and failed nowhere -> into index/toy-index.json
#   pr        a pull request, merged by this run when no command name needs a person
#
# Every check here is automatic except one: whether the command name an entry puts on
# PATH is one it should have (a name not on a machine yet can be claimed). A name that
# could take another's -- already in the index, a common system command, a generic word
# -- holds the PR for a person; with none of those it merges itself (owner, 2026-10-31).
name: index-discover

on:
  schedule:
    - cron: "41 4 * * 1"   # Mondays, after a week of daily index-check runs
  workflow_dispatch:
    inputs:
      max:
        description: "new repositories per run, at most"
        default: "40"

permissions:
  contents: read

concurrency:
  group: index-discover
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ids: ${{ steps.gen.outputs.ids }}
    steps:
      # One batch at a time. discover only knows what is on main, so with last week's
      # pull request still open it would propose the same repositories again, and a
      # second PR would sit next to one somebody may be half way through reviewing.
      - name: wait for the open discovery pull request, if any
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("index/discover-"))][0].number // empty')
          if [ -n "$pr" ]; then
            echo "#$pr is still open: review and merge (or close) it first; skipping this run."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.open.outputs.skip != '1'
      - uses: actions/setup-go@v7
        if: steps.open.outputs.skip != '1'
        with:
          go-version-file: go.mod

      - name: discover and generate
        if: steps.open.outputs.skip != '1'
        id: gen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          go run ./cmd/toy-index discover --max "${{ inputs.max || '40' }}" \
            --out out/candidates.txt --review out/review.txt
          # gen exits non-zero only when it produced nothing at all; that is a
          # quiet week, not a broken run.
          go run ./cmd/toy-index gen --repos out/candidates.txt --probe --out out/generated.json || true
          ids=""
          if [ -f out/generated.json ]; then
            ids=$(python3 -c 'import json; print(",".join(e["id"] for e in json.load(open("out/generated.json"))["packages"]))')
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "generated: ${ids:-nothing}"

      - uses: actions/upload-artifact@v7
        if: steps.open.outputs.skip != '1'
        with:
          name: discovered
          path: out/

  check:
    needs: generate
    if: needs.generate.outputs.ids != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: discovered
          path: out
      # Some entries failing is the point of this step, so its exit code is not the
      # verdict; the results file is.
      - name: install, run and uninstall every generated entry
        run: |
          bash scripts/index-check.sh --index out/generated.json \
            --only "${{ needs.generate.outputs.ids }}" --results "out/results-${{ matrix.os }}.tsv" || true
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.os }}
          path: out/results-${{ matrix.os }}.tsv

  pr:
    needs: [generate, check]
    if: needs.generate.outputs.ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120   # most of it is waiting for the PR's own required checks
    permissions:
      contents: write
      pull-requests: write
      actions: write   # to approve the PR's held checks, and to start the site deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: keep what installed
        run: |
          go run ./cmd/toy-index merge --from out/generated.json \
            --results out/results-ubuntu-latest.tsv,out/results-macos-latest.tsv \
            --review out/review.txt --report out/pr.md --flagged out/flagged.txt \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index/toy-index.json; then
            echo "nothing installed on both runners this week; no pull request"
            exit 0
          fi
          n=$(grep -c '^| \[' out/pr.md || true)
          branch="index/discover-$(date -u +%F)-${{ github.run_number }}"
          git config user.name Cirraya
          git config user.email tech@cirraya.com
          git switch -c "$branch"
          git add index/toy-index.json
          git commit -q -m "index: add $n entries found by discovery"
          git push -q origin "$branch"
          # The number comes from create's own output, never from a listing: something
          # else (Dependabot) can open a pull request in between.
          url=$(gh pr create --base main --head "$branch" \
            --title "index: $n entries found by discovery ($(date -u +%F))" --body-file out/pr.md)
          num="${url##*/}"
          echo "opened #$num"
          echo "PR_NUMBER=$num" >> "$GITHUB_ENV"
          # GitHub creates the pull request's own checks (ci, index-check) but holds them
          # for a maintainer's approval, because github-actions[bot] opened it. Approve
          # them here; if GitHub refuses, the PR shows "Approve and run" instead.
          sleep 20
          for id in $(gh run list --branch "$branch" --json databaseId,conclusion \
                        --jq '.[] | select(.conclusion == "action_required") | .databaseId'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve" \
              || echo "could not approve run $id; approve it on the pull request"
          done

      # The owner's call (2026-10-31): a batch with nothing that could take another
      # command's name merges itself, so an unreviewed PR no longer stops the index from
      # growing (one batch at a time). A blocking flag -- a name already in the index, a
      # common system command, a generic word -- still waits for a person.
      #
      # Merged here, synchronously, rather than with GitHub's auto-merge: a merge done
      # with GITHUB_TOKEN starts no push workflows, so pages.yml would never publish the
      # index. This job merges, then starts the deploy by hand.
      - name: merge it, unless a name needs a person
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "${PR_NUMBER:-}" ] || exit 0
          if [ -s out/flagged.txt ]; then
            gh pr comment "$PR_NUMBER" --body "Not merged automatically: a command name needs a person (see \"Command names to look at\")."
            echo "flagged, waiting for a person:"; cat out/flagged.txt
            exit 0
          fi
          # The four required checks (main's branch protection) appear once the runs
          # approved above start; wait for them to exist, then for them to finish.
          for _ in $(seq 1 60); do
            have=$(gh pr checks "$PR_NUMBER" --required --json name --jq 'length' 2>/dev/null || echo 0)
            [ "$have" -ge 4 ] && break
            sleep 15
          done
          if ! gh pr checks "$PR_NUMBER" --required --watch --interval 30; then
            gh pr comment "$PR_NUMBER" --body "Not merged automatically: a required check failed."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --rebase
          gh workflow run pages.yml --ref main
          echo "merged #$PR_NUMBER and started the site deploy"

